<body>
<header id="top" hidden>
  <a class="brand" href="#/shelf" aria-label="Unison shelf"><i class="mark"></i><span>Unison</span></a>
  <nav id="nav" aria-label="Library">
    <a href="#/shelf" data-tab="shelf">My Shelf</a>

    <a href="#/audiobooks" data-tab="audiobooks">Audiobooks</a>

  <form id="searchForm" role="search"><input id="search" type="search" placeholder="Search titles, authors, series, narrators" aria-label="Search the library"></form>

  <button id="theme" class="ghost icon" type="button" title="Light or dark" aria-label="Light or dark"></button>
  <div id="whoBox">
    <a id="who" class="ghost" href="#/account" title="Account"><i></i><span></span></a>
    <button id="whoBtn" class="ghost" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="whoMenu" hidden><i></i><span></span></button>
    <div id="whoMenu" role="menu" aria-label="Account" hidden><a role="menuitem" href="#/account">Account</a><a role="menuitem" href="#/admin">Admin</a></div>
  </div>
</header>
<main id="view" aria-live="polite"></main>
<audio id="audio" preload="metadata"></audio>
<div id="toast" hidden></div>
