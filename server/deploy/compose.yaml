# UnisonServer as a Compose stack, kept in /opt/stacks/unisonserver (see docs/SERVER.md, "Running it").
# The two library folders come from the .env file Deploy-Server.ps1 writes beside this one (from local.properties).
# Both libraries are mounted read-only: the server never writes beside the audiobooks or inside
# the Calibre library. Everything it produces lives in /opt/stacks/unisonserver/data.
services:
  unisonserver:
    build: ./build
    image: unisonserver:local
    container_name: unisonserver
    ports:
      - 8095:8080
    environment:
      - UNISON_WORKERS=4
      # The zone statistics fall back on when a client sends none (unison.timezone in local.properties).
      - TZ=${TZ:-UTC}
      # New requests on the wanted list are posted to this Discord channel webhook; off when empty. The address is a
      # secret: it comes from unison.wantedWebhook in local.properties (never in the repository) by way of the .env file.
      - UNISON_WANTED_WEBHOOK=${UNISON_WANTED_WEBHOOK:-}
    volumes:
      - ${UNISON_AUDIOBOOKS:?set unison.audiobooks in local.properties}:/audiobooks:ro
      - ${UNISON_EBOOKS:?set unison.ebooks in local.properties}:/ebooks:ro
      - /opt/stacks/unisonserver/data:/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
